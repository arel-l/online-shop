name: Maven Tests

on:

  push:

    branches:

      - lab1

  pull_request:

    branches:

      - lab1

      - main

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout

        uses: actions/checkout@v4

      - name: Set up JDK 17

        uses: actions/setup-java@v4

        with:

          distribution: temurin

          java-version: '17'

          cache: maven

      - name: Run tests

        run: |

          chmod +x mvnw

          ./mvnw --batch-mode test
          ./mvnw --batch-mode test
      chmod +x mvnw
      ./mvnw --batch-mode test
